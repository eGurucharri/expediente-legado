server:
  port: 8080

# Versión del build, visible en el pie del login para poder triar los
# reportes de los betatesters ("¿en qué build te pasó?"). El @...@ lo
# sustituye el filtrado de recursos de Maven (spring-boot-starter-parent
# lo activa por defecto sobre application*.yml).
siga98:
  version: "@project.version@"

spring:
  application:
    name: expediente-legado
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:siga98}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:siga98_app}
    password: ${DB_PASSWORD:changeme_app}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
