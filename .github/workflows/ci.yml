name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set up Java (for Maven)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Set up Node.js (using Node 24 as Node 20 is deprecated)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Install Godot 4 (the linux.x86_64 build runs headless via the --headless flag;
      # since 4.x there is no separate *_linux_headless.tar.xz asset)
      - name: Install Godot 4
        run: |
          set -e
          echo "Installing Godot 4.2.2-stable"
          GODOT_VERSION="4.2.2-stable"
          echo "Downloading Godot $GODOT_VERSION"
          wget --quiet --show-progress https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          echo "Extracting Godot"
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          echo "Moving binary to /usr/local/bin/godot4"
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot4
          sudo chmod +x /usr/local/bin/godot4
          echo "Verifying installation"
          godot4 --headless --version

      # Install gdtoolkit for linting Godot GDScript
      - name: Install gdtoolkit
        run: |
          pip install gdtoolkit

      # Test backend with Maven
      - name: Test backend with Maven
        run: |
          cd backend
          mvn -B test
          mvn -B checkstyle:check pmd:check spotbugs:check

      # Test frontend (Vitest) in backend/
      - name: Test frontend with Vitest
        run: |
          cd backend
          npm ci
          npm test

      # Test Godot suite
      - name: Test Godot suite
        run: |
          cd godot
          godot4 --headless --path . --import
          godot4 --headless --path . --script pruebas/pruebas.gd

      # Lint Godot GDScript
      - name: Lint Godot GDScript
        run: |
          cd godot
          gdlint .
          gdformat --check .