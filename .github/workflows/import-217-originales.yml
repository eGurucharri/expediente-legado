name: Importar originales CC0 #217

on:
  push:
    branches:
      - feature/217-tren-fondo

permissions:
  contents: write

jobs:
  importar:
    if: ${{ !contains(github.event.head_commit.message, '[import-217]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/217-tren-fondo
          fetch-depth: 0

      - name: Descargar originales Quaternius
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/AbrahamBrookes/hey-you-steal-that-bling/5b8a8c0dc26f10b66769135b27bef27a3e666aba/stolen_assets/Quaternius-trains'
          dst='godot/assets/cc0/quaternius_modular_train'
          mkdir -p "$dst"
          for file in CargoTrain_WagonEmpty.obj CargoTrain_WagonEmpty.mtl RailwayTrack_Straight.obj RailwayTrack_Straight.mtl; do
            curl -fsSL "$base/$file" -o "$dst/$file"
          done

      - name: Verificar blobs originales
        shell: bash
        run: |
          set -euo pipefail
          dst='godot/assets/cc0/quaternius_modular_train'
          test "$(git hash-object "$dst/CargoTrain_WagonEmpty.obj")" = 'aa97ae026cd4a74e1c5a36107c4af88fb8eb6bad'
          test "$(git hash-object "$dst/CargoTrain_WagonEmpty.mtl")" = '095118830935f30c197e3797aacfc3a1d4c5cf0b'
          test "$(git hash-object "$dst/RailwayTrack_Straight.obj")" = '117b1d04faf8c82690edf777a0a5d7311864c5d9'
          test "$(git hash-object "$dst/RailwayTrack_Straight.mtl")" = '43ed3f40f723923705f70808f8f1c6ac99d61887'

      - name: Sustituir copias y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-217-originales.yml
          git add godot/assets/cc0/quaternius_modular_train
          git commit -m 'fix: importar originales íntegros de Quaternius (#217) [import-217]'
          git push origin HEAD:feature/217-tren-fondo
